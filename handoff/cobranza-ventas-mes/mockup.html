<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<style>body{font-family:Inter,system-ui,sans-serif} .num{font-variant-numeric:tabular-nums}</style></head>
<body class="bg-slate-50 text-slate-900">
<div id="app" class="mx-auto max-w-[1200px] p-4 sm:p-8"></div>
<script>
const vista = new URLSearchParams(location.search).get('v') || 'faltante'
const S = n => 'S/ ' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})
const vend=['DIANA CHACON SALAZAR','LEONCIO VILLA','DANI PAREDES CALEB','JOSE ISMAEL DIAZ']
const cli=[['BOTICA LAS FLORES','10036699138'],['FARMACIA KATHERINE','20445614921'],['ALESS FARMA','20616192559'],['BOTICA MEDIC FARMA','10419594411'],['NOVAFARMA S.A.C.','20481460159'],['CENTRO MEDICO TELLO','20601290953'],['BOTICA FARMAFER','10333218661'],['GALENICA FARMA','20445399001']]
const deuda=[
 ['F002-00011203','03/09','03/10',22,2,0,1725.29,0],['F001-00013007','05/09','05/10',20,0,1,1561.50,500],['F002-00011248','08/09','08/10',17,1,2,1505.04,0],
 ['F001-00013041','10/09','10/10',15,3,3,980.40,200],['F002-00011290','15/09','15/10',10,0,4,801.23,0],['F001-00013088','18/09','18/10',7,2,5,698.84,0],
 ['F002-00011330','22/09','22/10',3,1,6,422.80,0],['F001-00013125','25/09','25/10',0,3,7,386.69,0],['F002-00011361','28/09','28/10',-3,0,0,321.78,0],['F001-00013160','30/09','30/10',-5,2,1,252.26,0]]
const pagas=[
 ['F001-00012950','01/09','14/09',13,0,0,2240.10,'Planilla 005541 · Depósito BCP'],['F002-00011190','02/09','02/09',0,1,1,1980.00,'Contado · Efectivo'],['F001-00012966','02/09','30/09',28,2,2,1846.35,'Planilla 005590 · Transferencia'],
 ['F002-00011201','03/09','20/09',17,3,3,1520.00,'Recibo R-000231 · Yape'],['F001-00012990','04/09','04/10',30,0,4,1410.75,'Planilla 005612 · Cheque'],['F002-00011222','06/09','15/09',9,1,5,1290.44,'Planilla 005551 · Depósito BBVA'],
 ['F001-00013012','07/09','07/09',0,2,6,1105.62,'Contado · Efectivo'],['F002-00011240','08/09','25/09',17,3,7,998.20,'Planilla 005598 · Depósito BCP']]
const dias=d=>d>30?'bg-red-100 text-red-700':d>0?'bg-amber-100 text-amber-800':'bg-sky-100 text-sky-700'
const diasTxt=d=>d>0?`Vencido ${d} d`:d===0?'Vence hoy':`Por vencer ${-d} d`
const tarjeta=(id,titulo,monto,sub,det,color,icono,activa)=>`
 <button class="group relative flex-1 rounded-2xl border bg-white p-5 text-left shadow-sm transition ${activa?`ring-2 ${color.ring} border-transparent`:'border-slate-200 hover:border-slate-300'}">
  <div class="flex items-center justify-between"><span class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">${titulo}</span>
   <span class="flex h-8 w-8 items-center justify-center rounded-lg ${color.ico}">${icono}</span></div>
  <div class="num mt-2 text-3xl font-bold ${color.txt}">${S(monto)}</div>
  <div class="mt-1 text-sm text-slate-600">${sub}</div>
  <div class="mt-3 text-xs text-slate-500">${det}</div>
  ${id!=='ventas'?`<div class="mt-3 text-xs font-medium ${color.txt}">${activa?'▼ Mostrando el detalle':'Ver comprobantes →'}</div>`:''}
 </button>`
const I={v:'<svg width=16 height=16 fill=none stroke=currentColor stroke-width=2 viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>',
 c:'<svg width=16 height=16 fill=none stroke=currentColor stroke-width=2 viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
 f:'<svg width=16 height=16 fill=none stroke=currentColor stroke-width=2 viewBox="0 0 24 24"><circle cx=12 cy=12 r=9 /><path d="M12 7v5l3 2"/></svg>'}
const filaDeuda=r=>`<tr class="border-t border-slate-100 hover:bg-slate-50">
 <td class="px-3 py-2.5"><a class="font-mono text-[13px] font-semibold text-blue-700 underline-offset-2 hover:underline">${r[0]}</a><div class="text-[11px] text-slate-500">Factura · 30 días</div></td>
 <td class="px-3 py-2.5"><div class="font-medium">${cli[r[5]][0]}</div><div class="text-[11px] text-slate-500">RUC ${cli[r[5]][1]}</div></td>
 <td class="px-3 py-2.5 text-[13px]">${vend[r[4]]}</td>
 <td class="num px-3 py-2.5 text-[13px]">${r[1]}/2026</td><td class="num px-3 py-2.5 text-[13px]">${r[2]}/2026</td>
 <td class="px-3 py-2.5"><span class="rounded-full px-2 py-0.5 text-[11px] font-semibold ${dias(r[3])}">${diasTxt(r[3])}</span></td>
 <td class="num px-3 py-2.5 text-right text-[13px]">${S(r[6])}</td><td class="num px-3 py-2.5 text-right text-[13px] text-emerald-700">${S(r[7])}</td>
 <td class="num px-3 py-2.5 text-right font-semibold text-red-700">${S(r[6]-r[7])}</td></tr>`
const filaPaga=r=>`<tr class="border-t border-slate-100 hover:bg-slate-50">
 <td class="px-3 py-2.5"><a class="font-mono text-[13px] font-semibold text-blue-700">${r[0]}</a><div class="text-[11px] text-slate-500">${r[3]===0?'Contado':'Crédito'}</div></td>
 <td class="px-3 py-2.5"><div class="font-medium">${cli[r[5]][0]}</div><div class="text-[11px] text-slate-500">RUC ${cli[r[5]][1]}</div></td>
 <td class="px-3 py-2.5 text-[13px]">${vend[r[4]]}</td>
 <td class="num px-3 py-2.5 text-[13px]">${r[1]}/2026</td><td class="num px-3 py-2.5 text-[13px]">${r[2]}/2026</td>
 <td class="px-3 py-2.5"><span class="rounded-full px-2 py-0.5 text-[11px] font-semibold ${r[3]>30?'bg-amber-100 text-amber-800':'bg-emerald-100 text-emerald-700'}">${r[3]===0?'Al momento':r[3]+' días'}</span></td>
 <td class="px-3 py-2.5 text-[12px] text-slate-600">${r[7]}</td>
 <td class="num px-3 py-2.5 text-right font-semibold text-emerald-700">${S(r[6])}</td></tr>`
const esF=vista==='faltante'
const app=`
<div class="flex flex-wrap items-end justify-between gap-3">
 <div class="flex items-center gap-3"><span class="flex h-11 w-11 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-600 to-sky-500 text-white">${I.v}</span>
 <div><h1 class="text-2xl font-bold">Cobranza de Ventas por Mes</h1><p class="text-sm text-slate-500">Lo vendido en el mes, cuánto ya se cobró y qué queda por cobrar, al día de hoy.</p></div></div>
 <div class="flex flex-wrap items-center gap-2">
  <div class="flex items-center gap-1 rounded-lg border border-slate-200 bg-white px-1 py-1 text-sm"><button class="rounded px-2 py-1 hover:bg-slate-100">‹</button><span class="px-2 font-semibold">Septiembre 2026</span><button class="rounded px-2 py-1 hover:bg-slate-100">›</button></div>
  <select class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm"><option>Todos los vendedores</option></select>
  <button class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white">Consultar</button></div></div>

<div class="mt-6 flex flex-col gap-4 lg:flex-row">
 ${tarjeta('ventas','Ventas septiembre',180000,'128 comprobantes emitidos','Facturas y boletas, sin anulados · NC descontadas',{txt:'text-slate-900',ico:'bg-indigo-100 text-indigo-700',ring:''},I.v,false)}
 ${tarjeta('cobrado','Cobrado',150000,'<b class="text-emerald-700">83.3%</b> · 102 comprobantes pagados','Incluye pagos parciales de 4 comprobantes',{txt:'text-emerald-700',ico:'bg-emerald-100 text-emerald-700',ring:'ring-emerald-500'},I.c,!esF)}
 ${tarjeta('faltante','Faltante',30000,'<b class="text-red-700">16.7%</b> · 26 comprobantes con deuda','<span class="text-red-700 font-semibold">S/ 21,450.00 vencido</span> · S/ 8,550.00 por vencer',{txt:'text-red-700',ico:'bg-red-100 text-red-700',ring:'ring-red-500'},I.f,esF)}
</div>
<div class="mt-4 overflow-hidden rounded-full bg-slate-200"><div class="flex h-2.5"><div class="bg-emerald-500" style="width:83.3%"></div><div class="bg-red-500" style="width:11.9%"></div><div class="bg-amber-400" style="width:4.8%"></div></div></div>
<div class="mt-1.5 flex gap-4 text-[11px] text-slate-500"><span>● <span class="text-emerald-600">Cobrado</span></span><span>● <span class="text-red-600">Vencido</span></span><span>● <span class="text-amber-600">Por vencer</span></span></div>

<div class="mt-6 rounded-2xl border border-slate-200 bg-white shadow-sm">
 <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 px-5 py-4">
  <div><h2 class="font-semibold">${esF?'Comprobantes con deuda · <span class="text-red-700">S/ 30,000.00</span>':'Comprobantes pagados · <span class="text-emerald-700">S/ 150,000.00</span>'}</h2>
  <p class="text-xs text-slate-500">${esF?'26 comprobantes · ordenados por días vencidos':'102 comprobantes · con la fecha y la forma de pago'}</p></div>
  <div class="flex flex-wrap items-center gap-2">
   ${esF?['Todos 26','Vencido +30 d 3','Vencido 1-30 d 15','Por vencer 8'].map((t,i)=>`<button class="rounded-full border px-3 py-1 text-xs font-medium ${i===0?'border-slate-900 bg-slate-900 text-white':'border-slate-200 text-slate-600'}">${t}</button>`).join(''):['Todos 102','Contado 31','Crédito a tiempo 58','Pagó con atraso 13'].map((t,i)=>`<button class="rounded-full border px-3 py-1 text-xs font-medium ${i===0?'border-slate-900 bg-slate-900 text-white':'border-slate-200 text-slate-600'}">${t}</button>`).join('')}
   <input placeholder="Cliente, RUC o comprobante" class="w-52 rounded-lg border border-slate-200 px-3 py-1.5 text-sm">
   <button class="rounded-lg border border-slate-200 px-3 py-1.5 text-sm">Excel</button><button class="rounded-lg border border-slate-200 px-3 py-1.5 text-sm">PDF</button></div></div>
 ${esF?`<div class="grid grid-cols-2 gap-3 border-b border-slate-100 bg-slate-50/60 px-5 py-3 sm:grid-cols-4">
   ${[['DIANA CHACON SALAZAR',11200,9],['LEONCIO VILLA',8650,7],['DANI PAREDES CALEB',6320,6],['JOSE ISMAEL DIAZ',3830,4]].map(v=>`<div class="rounded-lg border border-slate-200 bg-white px-3 py-2"><div class="truncate text-[11px] font-semibold text-slate-500">${v[0]}</div><div class="num text-sm font-bold text-red-700">${S(v[1])}</div><div class="text-[11px] text-slate-500">${v[2]} comprobantes</div></div>`).join('')}</div>`:''}
 <div class="divide-y divide-slate-100 sm:hidden">${(esF?deuda:[]).map(r=>`<div class="px-4 py-3">
   <div class="flex items-start justify-between gap-2"><div><a class="font-mono text-[13px] font-semibold text-blue-700">${r[0]}</a><div class="text-sm font-medium">${cli[r[5]][0]}</div><div class="text-[11px] text-slate-500">${vend[r[4]]}</div></div>
   <div class="text-right"><div class="num font-bold text-red-700">${S(r[6]-r[7])}</div><span class="rounded-full px-2 py-0.5 text-[10px] font-semibold ${dias(r[3])}">${diasTxt(r[3])}</span></div></div>
   <div class="mt-1.5 flex justify-between text-[11px] text-slate-500"><span>Emitido ${r[1]} · vence ${r[2]}</span><span>Total ${S(r[6])}${r[7]?' · abonó '+S(r[7]):''}</span></div></div>`).join('')}</div>
 <div class="hidden overflow-x-auto sm:block"><table class="w-full min-w-[980px] text-sm">
  <thead class="bg-slate-50 text-left text-[11px] font-semibold uppercase tracking-wide text-slate-500"><tr>
  ${esF?'<th class="px-3 py-2">Comprobante</th><th class="px-3 py-2">Cliente</th><th class="px-3 py-2">Vendedor</th><th class="px-3 py-2">Emisión</th><th class="px-3 py-2">Vence</th><th class="px-3 py-2">Situación</th><th class="px-3 py-2 text-right">Total</th><th class="px-3 py-2 text-right">Abonado</th><th class="px-3 py-2 text-right">Saldo</th>'
  :'<th class="px-3 py-2">Comprobante</th><th class="px-3 py-2">Cliente</th><th class="px-3 py-2">Vendedor</th><th class="px-3 py-2">Emisión</th><th class="px-3 py-2">Pagado el</th><th class="px-3 py-2">Tardó</th><th class="px-3 py-2">Cómo se cobró</th><th class="px-3 py-2 text-right">Importe</th>'}
  </tr></thead><tbody>${(esF?deuda.map(filaDeuda):pagas.map(filaPaga)).join('')}</tbody></table></div>
 <div class="flex flex-col gap-1 border-t border-slate-100 px-5 py-3 text-xs text-slate-500 sm:flex-row sm:justify-between"><span>Mostrando 10 de ${esF?26:102}</span><span>Clic en el comprobante: ver el detalle (artículos, pagos y PDF)</span></div>
</div>
<p class="mt-4 text-center text-[11px] text-slate-400">Mockup con datos de ejemplo</p>`
document.getElementById('app').innerHTML=app
</script></body></html>
